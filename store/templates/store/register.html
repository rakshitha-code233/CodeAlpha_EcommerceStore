{% extends 'store/base.html' %}
{% block title %}Create account | MarketLane{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Create an Account</h2>
    <form method="post">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" maxlength="150" required>
        <label for="email">Email (optional)</label>
        <input type="email" id="email" name="email">
        <label for="password1">Password</label>
        <input type="password" id="password1" name="password1" minlength="8" required>
        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" name="password2" minlength="8" required>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>
{% endblock %}
